# En local : accès limité à ce Mac (les collègues passent par la version
# cloud). Ce réglage est ignoré par Streamlit Community Cloud.
[server]
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2f56d0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1a1f2b"
font = "sans serif"
