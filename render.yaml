# Déploiement sur Render (https://render.com) — service web Streamlit.
# Les valeurs des variables (identifiants Gmail, mot de passe d'accès) se
# saisissent dans Render au moment du déploiement (sync: false = jamais dans le dépôt).
services:
  - type: web
    name: paie-envoi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_MDP_SHA256
        sync: false
